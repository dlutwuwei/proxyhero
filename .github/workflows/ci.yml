name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust setup
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'
          key: lint

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy -p proxy-core --all-targets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Sync node version
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

  test:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust setup
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Run cargo test
        run: cargo test -p proxy-core

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust setup
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Sync node version
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app (without signing)
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        with:
          args: '--debug'

      - name: Upload debug artifacts
        if: always() && steps.tauri-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: proxyhero-debug-${{ github.run_id }}
          path: |
            target/debug/bundle/macos/*.dmg
            target/debug/bundle/macos/*.app.tar.gz
            target/debug/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn
          retention-days: 7
