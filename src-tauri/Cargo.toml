[package]
name = "lk-debug-proxy"
version = "0.1.0"
description = "ProxyHero (proxyhero) - MITM proxy for frontend integration debugging"
authors = ["lk"]
edition = "2021"

[lib]
name = "lk_debug_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSAppearance", "NSColor", "NSWindow"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs", "macros"] }
proxy-core = { path = "../crates/proxy-core" }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-notification = "2.3.3"
